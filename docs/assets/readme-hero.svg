<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Nykst — Deterministic Graph-RAG Architecture for Software Systems</title>
  <desc id="desc">Executive dark banner featuring the Nykst hexagonal Graph-RAG prism mark, architectural telemetry from flawsom/nykst-software-intellegence, and 6-level AST navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05090e"/>
      <stop offset="55%" stop-color="#08111a"/>
      <stop offset="100%" stop-color="#050d15"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="68%" stop-color="#d8fbf4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#152230" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .node { font-size: 12px; font-weight: 600; fill: #e6edf3; }
      .node-sub { font-size: 9.5px; fill: #8ba0b4; }
      .pill { font-size: 11.5px; font-weight: 500; fill: #c6d6e3; }
      .flow { stroke-dasharray: 5 9; animation: dash 2.4s linear infinite; }
      .pulse { animation: pulse 4.6s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: .92 } }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)" opacity="0.58"/>
  <ellipse cx="260" cy="80" rx="460" ry="310" fill="url(#tealGlow)"/>
  <ellipse cx="1390" cy="640" rx="480" ry="330" fill="url(#blueGlow)"/>
  <ellipse cx="1180" cy="370" rx="440" ry="340" fill="url(#centerGlow)"/>

  <!-- Left: Executive mark + brand + value proposition -->
  <g class="sans">
    <!-- Hexagonal Prism Emblem -->
    <g transform="translate(104, 88)">
      <rect width="68" height="68" rx="17" fill="#070f18" stroke="#223a4e" stroke-width="1.8"/>
      <polygon points="34,9 55,21 55,47 34,59 13,47 13,21" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5"/>
      <path d="M20,46 L20,22 L48,46 L48,22" fill="none" stroke="url(#prism)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="20" y1="34" x2="48" y2="34" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="2.5 2.5"/>
      <circle cx="20" cy="22" r="3.8" fill="#070f18" stroke="#5eead4" stroke-width="2.2"/>
      <circle cx="48" cy="46" r="3.8" fill="#070f18" stroke="#2dd4bf" stroke-width="2.2"/>
      <circle cx="20" cy="46" r="2.8" fill="#60a5fa"/>
      <circle cx="48" cy="22" r="2.8" fill="#a78bfa"/>
      <circle cx="34" cy="34" r="3.5" fill="#5eead4"/>
    </g>

    <g transform="translate(190, 108)">
      <rect width="348" height="28" rx="14" fill="#0c1c24" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <circle cx="16" cy="14" r="4" fill="#5eead4"/>
      <text x="28" y="18" class="mono" font-size="10.5" letter-spacing="2.2" fill="#5eead4">DETERMINISTIC AST + GRAPH-RAG ENGINE</text>
    </g>

    <text x="100" y="302" font-size="132" font-weight="700" letter-spacing="10" fill="url(#word)">NYKST</text>
    <text x="106" y="368" font-size="34" font-weight="600" fill="#eef6fc" letter-spacing="-0.4">We are not a wrapper. We are the</text>
    <text x="106" y="412" font-size="34" font-weight="600" fill="#5eead4" letter-spacing="-0.4">deterministic Graph-RAG architecture.</text>
    <text x="106" y="464" font-size="17.5" fill="#95a8b8">TypeScript AST compiler + Tarjan SCC cycle detection + BFS reverse</text>
    <text x="106" y="492" font-size="17.5" fill="#95a8b8">blast-radius reachability + temporal co-change coupling + 6-layer Memory.</text>

    <!-- Feature pills -->
    <g transform="translate(106, 532)">
      <rect width="194" height="38" rx="19" fill="#0b151e" stroke="#223646"/>
      <circle cx="20" cy="19" r="4" fill="#5eead4"/>
      <text x="34" y="24" class="pill">Zero vector guesswork</text>

      <rect x="208" width="212" height="38" rx="19" fill="#0b151e" stroke="#223646"/>
      <circle cx="228" cy="19" r="4" fill="#60a5fa"/>
      <text x="242" y="24" class="pill">Exact line-level blast radius</text>

      <rect x="434" width="198" height="38" rx="19" fill="#0b151e" stroke="#223646"/>
      <circle cx="454" cy="19" r="4" fill="#a78bfa"/>
      <text x="468" y="24" class="pill">Streamable HTTP MCP</text>
    </g>

    <!-- Live telemetry strip -->
    <g transform="translate(106, 598)">
      <rect width="632" height="68" rx="14" fill="#09121a" stroke="#1d2e3d"/>
      <text x="22" y="27" class="mono" font-size="10" letter-spacing="2" fill="#5eead4">LIVE SELF-INDEXED TELEMETRY · FLAWSOM/NYKST-SOFTWARE-INTELLEGENCE</text>
      <text x="22" y="49" class="mono" font-size="13" font-weight="600" fill="#e6f1f8">156 AST Files  ·  297 Import Edges  ·  22,797 LOC  ·  10 SQL Tables  ·  0 Unresolved</text>
    </g>
  </g>

  <!-- Right: Live System Graph Panel -->
  <g transform="translate(840, 88)">
    <rect width="660" height="578" rx="24" fill="#091118" fill-opacity="0.94" stroke="#223444" stroke-width="1.4"/>
    <rect width="660" height="48" rx="24" fill="#0d1720"/>
    <rect y="24" width="660" height="24" fill="#0d1720"/>
    <line x1="0" y1="48" x2="660" y2="48" stroke="#1b2b38"/>
    <circle cx="24" cy="24" r="4.2" fill="#f87171" opacity="0.8"/>
    <circle cx="40" cy="24" r="4.2" fill="#fbbf24" opacity="0.8"/>
    <circle cx="56" cy="24" r="4.2" fill="#34d399" opacity="0.8"/>
    <text x="76" y="28" class="mono" font-size="11" fill="#8ba0b4">nykst://graph/flawsom/nykst-software-intellegence</text>
    <rect x="524" y="13" width="116" height="22" rx="11" fill="#0d2a29" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="582" y="28" class="mono" font-size="9.5" text-anchor="middle" fill="#5eead4">AST VERIFIED</text>

    <!-- Edges -->
    <g stroke="url(#edge)" stroke-width="1.5">
      <line class="flow" x1="330" y1="298" x2="165" y2="144"/>
      <line class="flow" x1="330" y1="298" x2="330" y2="118"/>
      <line class="flow" x1="330" y1="298" x2="495" y2="144"/>
      <line class="flow" x1="330" y1="298" x2="532" y2="262"/>
      <line class="flow" x1="330" y1="298" x2="498" y2="394"/>
      <line class="flow" x1="330" y1="298" x2="330" y2="444"/>
      <line class="flow" x1="330" y1="298" x2="162" y2="394"/>
      <line class="flow" x1="330" y1="298" x2="128" y2="262"/>
    </g>

    <!-- Center Node -->
    <circle cx="330" cy="298" r="138" fill="#5eead4" opacity="0.06" class="pulse"/>
    <circle cx="330" cy="298" r="88" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" stroke-dasharray="3 8"/>
    <circle cx="330" cy="298" r="66" fill="#0d1922" stroke="#5eead4" stroke-width="1.8"/>
    <text x="330" y="288" class="sans" font-size="21" font-weight="700" text-anchor="middle" fill="#f1f7fb">nykst</text>
    <text x="330" y="308" class="mono" font-size="8.8" letter-spacing="2.4" text-anchor="middle" fill="#5eead4">GRAPH-RAG CORE</text>
    <text x="330" y="326" class="mono" font-size="9" text-anchor="middle" fill="#8ba0b4">156 files · 297 edges</text>

    <!-- Real Repository Domains -->
    <g transform="translate(165, 144)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#5eead4"/>
      <text x="-56" y="-2" class="sans node">src/lib/analysis</text>
      <text x="-56" y="12" class="mono node-sub">AST compiler · Tarjan · BFS</text>
    </g>
    <g transform="translate(330, 118)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#60a5fa"/>
      <text x="-56" y="-2" class="sans node">src/routes/api.*</text>
      <text x="-56" y="12" class="mono node-sub">22 API endpoints · SSR</text>
    </g>
    <g transform="translate(495, 144)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#a78bfa"/>
      <text x="-56" y="-2" class="sans node">src/components/graph</text>
      <text x="-56" y="12" class="mono node-sub">6-level canvas · Dossier</text>
    </g>
    <g transform="translate(532, 262)">
      <rect x="-84" y="-21" width="168" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-66" cy="-2" r="3.5" fill="#fbbf24"/>
      <text x="-54" y="-2" class="sans node">src/lib/mcp.server</text>
      <text x="-54" y="12" class="mono node-sub">5 read-only MCP tools</text>
    </g>
    <g transform="translate(498, 394)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#fb7185"/>
      <text x="-56" y="-2" class="sans node">integrations/github</text>
      <text x="-56" y="12" class="mono node-sub">Tarball · OAuth · History</text>
    </g>
    <g transform="translate(330, 444)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#34d399"/>
      <text x="-56" y="-2" class="sans node">supabase/migrations</text>
      <text x="-56" y="12" class="mono node-sub">10 RLS tables · Realtime</text>
    </g>
    <g transform="translate(162, 394)">
      <rect x="-86" y="-21" width="172" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-68" cy="-2" r="3.5" fill="#5eead4"/>
      <text x="-56" y="-2" class="sans node">src/lib/byok.server</text>
      <text x="-56" y="12" class="mono node-sub">AES-256-GCM · Nara Flash</text>
    </g>
    <g transform="translate(128, 262)">
      <rect x="-84" y="-21" width="168" height="42" rx="10" fill="#0e1821" stroke="#263948"/>
      <circle cx="-66" cy="-2" r="3.5" fill="#c084fc"/>
      <text x="-54" y="-2" class="sans node">before-you-act.ts</text>
      <text x="-54" y="12" class="mono node-sub">Consequence envelope</text>
    </g>

    <line x1="0" y1="512" x2="660" y2="512" stroke="#1b2b38"/>
    <text x="24" y="544" class="mono" font-size="10.5" fill="#8ba0b4">ORG → DOMAIN → CAPABILITY → SERVICE → MODULE → FILE</text>
    <text x="636" y="544" class="mono" font-size="10" text-anchor="end" fill="#5eead4">ZERO MOCK DATA</text>
  </g>

  <!-- Bottom multi-spectrum accent line -->
  <rect x="0" y="756" width="1600" height="4" fill="#0c1822"/>
  <rect x="0" y="756" width="560" height="4" fill="#2dd4bf" opacity="0.85"/>
  <rect x="560" y="756" width="540" height="4" fill="#60a5fa" opacity="0.55"/>
  <rect x="1100" y="756" width="500" height="4" fill="#a78bfa" opacity="0.4"/>
</svg>
